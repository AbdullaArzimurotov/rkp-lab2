<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка школьника</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="paper">
<h1>Карточка школьника</h1>
<dl>
    <dt>Идентификатор</dt><dd th:text="${selectedSchoolboy.id}"></dd>
    <dt>Фамилия</dt><dd th:text="${selectedSchoolboy.surname}"></dd>
    <dt>Имя</dt><dd th:text="${selectedSchoolboy.name}"></dd>
    <dt>Отчество</dt><dd th:text="${selectedSchoolboy.patronymic}"></dd>
    <dt>Пол</dt><dd th:text="${selectedSchoolboy.gender}"></dd>
    <dt>Национальность</dt><dd th:text="${selectedSchoolboy.nationality}"></dd>
    <dt>Рост, см</dt><dd th:text="${selectedSchoolboy.height}"></dd>
    <dt>Вес, кг</dt><dd th:text="${selectedSchoolboy.weight}"></dd>
    <dt>Дата рождения</dt><dd th:text="${selectedSchoolboy.birthDate}"></dd>
    <dt>Мобильный телефон</dt><dd th:text="${selectedSchoolboy.phoneNumber}"></dd>
    <dt>Домашний телефон</dt><dd th:text="${selectedSchoolboy.homePhone}"></dd>
</dl>
<div class="actions">
    <a class="button" th:href="@{/schoolboys/update/{id}(id=${selectedSchoolboy.id})}">Изменить</a>
    <form th:action="@{/schoolboys/delete/{id}(id=${selectedSchoolboy.id})}" method="post">
        <button class="danger" type="submit">Удалить</button>
    </form>
    <a class="button secondary" th:href="@{/schoolboys/main}">К списку</a>
</div>
</main>
</body>
</html>
