<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Список школьников</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Список школьников</h2>

    <div class="mb-3">
        <a href="/schoolboys/add" class="btn btn-success">Добавить ученика</a>
    </div>

    <div th:if="${schoolboys.size() == 0}" class="alert alert-warning">
        Список пуст. Данные не найдены.
    </div>

    <table th:if="${schoolboys.size() > 0}" class="table table-hover table-bordered">
        <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>Фамилия</th>
            <th>Имя</th>
            <th>Дата рождения</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="schoolboy : ${schoolboys}">
            <td th:text="${schoolboy.id}"></td>
            <td th:text="${schoolboy.surname}"></td>
            <td th:text="${schoolboy.name}"></td>
            <td th:text="${schoolboy.birthDate}"></td>
            <td>
                <a class="btn btn-info btn-sm" th:href="@{'/schoolboys/details/' + ${schoolboy.id}}">Подробнее</a>
                <a class="btn btn-warning btn-sm" th:href="@{'/schoolboys/update/' + ${schoolboy.id}}">Редактировать</a>
                <a class="btn btn-danger btn-sm" th:href="@{'/schoolboys/delete/' + ${schoolboy.id}}">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
