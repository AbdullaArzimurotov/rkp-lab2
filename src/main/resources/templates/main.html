<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьники</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="wide">
<header>
    <h1>Школьники</h1>
    <nav aria-label="Разделы">
        <a th:href="@{/students}">Пример «Студенты»</a>
        <a class="button" th:href="@{/schoolboys/add}">Добавить школьника</a>
    </nav>
</header>
<p class="muted">Вариант 2 · Spring Data JPA</p>
<div class="table">
<table>
    <thead><tr><th>Фамилия</th><th>Имя</th><th>Отчество</th><th>Дата рождения</th><th>Мобильный телефон</th><th>Действия</th></tr></thead>
    <tbody>
    <tr th:each="record : ${schoolboys}">
        <td th:text="${record.surname}"></td><td th:text="${record.name}"></td><td th:text="${record.patronymic}"></td>
        <td th:text="${record.birthDate}"></td><td th:text="${record.phoneNumber}"></td>
        <td class="actions"><a th:href="@{/schoolboys/details/{id}(id=${record.id})}">Открыть</a>
            <a th:href="@{/schoolboys/update/{id}(id=${record.id})}">Изменить</a></td>
    </tr>
    </tbody>
</table>
</div>
</main>
</body>
</html>
